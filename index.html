<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Viewport otimizado para travar zoom indesejado e ajustar em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>JARVIS - Virtual Assistant</title>
    <link rel="shortcut icon" href="avatar.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <!-- Container que simula a tela do celular no PC e ocupa tudo no mobile -->
    <div class="mobile-frame">
        <section class="main">
            <div class="image-container">
                <div class="image">
                    <img src="giphy.gif" alt="JARVIS Animation">
                </div>
                <h1>J A R V I S</h1>
                <p>I'm a Virtual Assistant JARVIS, How may I help you?</p>
            </div>
            <div class="input">
                <button class="talk" aria-label="Falar com o JARVIS"><i class="fas fa-microphone-alt"></i></button>
                <h1 class="content">Click here to speak</h1>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
